name: Build Binaries

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write
  attestations: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub Actions has no cross-workflow `needs`, so this in-workflow gate
  # runs the same checks as CI before any release artifacts are produced.
  verify:
    name: Pre-release verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install tsx
        run: npm install -g tsx

      # cmd/pulse embeds pkg/webui/dist/*, which is not committed; make test
      # compiles ./cmd/... so the assets must exist first.
      - name: Build web UI assets
        run: make build-webui

      - name: make test
        run: make test

      - name: Cross-generator checks
        run: make test-cross-generator

      - name: integration harness
        run: go test ./tests/integration/... -count=1

  build:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary_name: linux-amd64
            GOOS: linux
            GOARCH: amd64
          - binary_name: linux-arm64
            GOOS: linux
            GOARCH: arm64
          - binary_name: darwin-amd64
            GOOS: darwin
            GOARCH: amd64
          - binary_name: darwin-arm64
            GOOS: darwin
            GOARCH: arm64
          - binary_name: windows-amd64
            GOOS: windows
            GOARCH: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build web UI
        working-directory: pkg/webui
        run: |
          npm install
          npm run build

      - name: Build binary
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
        run: make build

      - name: Rename binary
        run: |
          if [ "${{ matrix.binary_name }}" = "windows-amd64" ]; then
            mv target/pulserpc target/pulserpc-${{ matrix.binary_name }}.exe
          else
            mv target/pulserpc target/pulserpc-${{ matrix.binary_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulserpc-${{ matrix.binary_name }}${{ matrix.binary_name == 'windows-amd64' && '.exe' || '' }}
          path: target/pulserpc-${{ matrix.binary_name }}${{ matrix.binary_name == 'windows-amd64' && '.exe' || '' }}
          if-no-files-found: error

  docker:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker images (linux-amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}-amd64
            ghcr.io/${{ github.repository }}:latest-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push Docker images (linux-arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}-arm64
            ghcr.io/${{ github.repository }}:latest-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Create and push manifests
        run: |
          # Create manifest combining both architectures for versioned tag
          docker manifest create ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }} \
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}-amd64 \
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}-arm64
          # Push the versioned manifest
          docker manifest push ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

          # Create and push manifest for latest
          docker manifest create ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:latest-amd64 \
            ghcr.io/${{ github.repository }}:latest-arm64
          docker manifest push ghcr.io/${{ github.repository }}:latest

  assemble:
    needs: [build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pulserpc-*
          path: target
          merge-multiple: true

      - name: Compute SHA256 checksums
        working-directory: target
        run: |
          sha256sum pulserpc-* > pulserpc_checksums.txt
          cat pulserpc_checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            target/pulserpc-*
            target/pulserpc_checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
