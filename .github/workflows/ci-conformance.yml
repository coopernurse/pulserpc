name: CI Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Multi-runtime conformance (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install tsx
        run: npm install -g tsx

      - name: Build
        run: make build

      - name: Multi-runtime conformance tests
        run: make test-all-runtimes

      - name: Compare cross-runtime golden responses
        run: python3 tests/integration/compare_golden.py

      - name: Check per-runtime golden baselines
        run: python3 tests/integration/check_golden_baselines.py

      - name: Upload golden responses
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: golden-responses
          path: /tmp/pulserpc-golden
          if-no-files-found: warn

      - name: Dump Docker logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          docker ps -a
          for c in $(docker ps -a --format '{{.Names}}'); do
            case "$c" in
              pulserpc-test-*)
                echo "===== docker logs $c ====="
                docker logs "$c" 2>&1 || true
                ;;
            esac
          done

  quickstarts:
    name: Quickstart guides (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install test tooling
        run: |
          npm install -g tsx typescript @types/node
          python -m pip install pytest

      - name: Build
        run: make build

      - name: Quickstart tests
        run: make test-quickstarts

      - name: Dump Docker logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          docker ps -a
          for c in $(docker ps -a --format '{{.Names}}'); do
            case "$c" in
              pulserpc-test-*)
                echo "===== docker logs $c ====="
                docker logs "$c" 2>&1 || true
                ;;
            esac
          done
