name: Documentation Deploy

on:
  workflow_run:
    workflows: ["Documentation CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Documentation CI run id whose jekyll-site artifact should be deployed"
        required: true
        type: string

permissions:
  contents: read
  actions: read  # required to download the jekyll-site artifact from the triggering run
  pages: write
  id-token: write

# Allow only one concurrent deployment, canceling any in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: docs/_site

      - name: Fix page permissions
        run: |
          chmod -cvR +rX "docs/_site/"

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
